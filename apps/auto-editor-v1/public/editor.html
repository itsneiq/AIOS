<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIOS Core Editor</title><link rel="stylesheet" href="/editor/editor.css"></head><body><div class="app-shell"><header class="topbar"><div><b>AIOS Core Editor</b><span id="projectName">Untitled Project</span></div><div class="top-actions"><a class="button ghost" href="/">Batch Editor</a><button class="button ghost" id="undoBtn">Undo</button><button class="button ghost" id="redoBtn">Redo</button><button class="button ghost" id="newProjectBtn">New</button><button class="button ghost" id="openProjectBtn">Open</button><button class="button primary" id="saveProjectBtn">Save</button></div></header><main class="workspace"><aside class="media-panel panel"><div class="panel-head"><h2>Media</h2><button class="button mini" id="browseBtn">Import</button></div><input id="fileInput" type="file" accept="video/*" multiple hidden><div class="drop-zone" id="dropZone"><strong>Drop video di sini</strong><span>MP4, MOV, AVI, MKV, WEBM</span></div><div id="mediaList" class="media-list"></div></aside><section class="center-column"><section class="preview-panel panel"><div class="panel-head"><h2>Preview</h2><span id="timeLabel">00:00 / 00:00</span></div><div class="preview-stage"><video id="preview" controls playsinline></video><div id="emptyPreview">Import video untuk mulai mengedit</div></div><div class="transport"><button class="button mini" id="playBtn">Play / Pause</button><input id="seek" type="range" min="0" max="1000" value="0"></div></section><section class="timeline-panel panel"><div class="panel-head"><div><h2>Timeline</h2><span id="selectionLabel">Belum ada clip</span></div><div class="timeline-tools"><button class="button mini" id="splitBtn">Split (S)</button><button class="button mini" id="copyBtn">Copy</button><button class="button mini" id="pasteBtn">Paste</button><label>Zoom <input id="zoom" type="range" min="50" max="300" value="100"></label></div></div><div class="timeline-scroll"><div class="ruler" id="ruler"></div><div class="track"><div class="track-label">V2</div><div class="timeline" data-track="V2"></div></div><div class="track"><div class="track-label">V1</div><div class="timeline" data-track="V1"></div></div><div class="track audio"><div class="track-label">A1</div><div class="timeline" data-track="A1"></div></div><div class="playhead" id="playhead"></div></div><div class="trim-controls"><label>In <input id="trimStart" type="range" min="0" max="1000" value="0"></label><label>Out <input id="trimEnd" type="range" min="0" max="1000" value="1000"></label><button class="button danger mini" id="removeClipBtn">Delete</button></div></section></section><aside class="inspector panel"><div class="panel-head"><h2>Inspector</h2></div><label>Clip name<input id="clipName" placeholder="Select a clip"></label><label>Track<select id="clipTrack"><option>V1</option><option>V2</option><option>A1</option></select></label><label>Start<input id="clipStart" readonly></label><label>End<input id="clipEnd" readonly></label><label>Duration<input id="clipDuration" readonly></label><div class="recent-projects"><h3>Recent Projects</h3><div id="recentProjects"></div></div></aside></main></div><div class="toast" id="toast"></div><script type="module" src="/editor/editor.js"></script></body></html>
