<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIOS Core Editor</title>
<link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div><b>AIOS Core Editor</b><span id="projectName">Untitled Project</span></div>
    <div class="top-actions">
      <a class="button ghost" href="/">Batch Editor</a>
      <button class="button ghost" id="newProjectBtn">New Project</button>
      <button class="button ghost" id="openProjectBtn">Open Project</button>
      <button class="button primary" id="saveProjectBtn">Save Project</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="media-panel panel">
      <div class="panel-head"><h2>Media</h2><button class="button mini" id="browseBtn">Import</button></div>
      <input id="fileInput" type="file" accept="video/mp4,video/quicktime,video/x-msvideo,video/x-matroska,video/webm" multiple hidden>
      <div class="drop-zone" id="dropZone">
        <strong>Drop video di sini</strong>
        <span>MP4, MOV, AVI, MKV, WEBM</span>
      </div>
      <div id="mediaList" class="media-list"></div>
    </aside>

    <section class="center-column">
      <section class="preview-panel panel">
        <div class="panel-head"><h2>Preview</h2><span id="timeLabel">00:00 / 00:00</span></div>
        <div class="preview-stage"><video id="preview" controls playsinline></video><div id="emptyPreview">Import video untuk mulai mengedit</div></div>
        <div class="transport">
          <button class="button mini" id="playBtn">Play / Pause</button>
          <input id="seek" type="range" min="0" max="1000" value="0">
        </div>
      </section>

      <section class="timeline-panel panel">
        <div class="panel-head"><h2>Timeline</h2><span id="selectionLabel">Belum ada clip</span></div>
        <div class="ruler" id="ruler"></div>
        <div class="track"><div class="track-label">V1</div><div id="timeline" class="timeline"></div></div>
        <div class="trim-controls">
          <label>In <input id="trimStart" type="range" min="0" max="1000" value="0"></label>
          <label>Out <input id="trimEnd" type="range" min="0" max="1000" value="1000"></label>
          <button class="button danger mini" id="removeClipBtn">Remove</button>
        </div>
      </section>
    </section>

    <aside class="inspector panel">
      <div class="panel-head"><h2>Inspector</h2></div>
      <label>Clip name<input id="clipName" placeholder="Select a clip"></label>
      <label>Start time<input id="clipStart" readonly></label>
      <label>End time<input id="clipEnd" readonly></label>
      <label>Duration<input id="clipDuration" readonly></label>
      <div class="recent-projects"><h3>Recent Projects</h3><div id="recentProjects"></div></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/editor/editor.js"></script>
</body>
</html>
