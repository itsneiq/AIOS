name: AIOS Auto Editor Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/auto-editor-v1/**"
      - ".github/workflows/auto-editor-windows-installer.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/auto-editor-v1/**"
      - ".github/workflows/auto-editor-windows-installer.yml"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/auto-editor-v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Validate JavaScript
        shell: pwsh
        run: npm run check

      - name: Build NSIS installer
        shell: pwsh
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path dist -Filter "*.exe" -File
          if ($installers.Count -lt 1) {
            throw "Electron Builder tidak menghasilkan installer .exe."
          }
          $installers | Select-Object FullName, Length

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIOS-Auto-Editor-Windows-Installer
          path: |
            apps/auto-editor-v1/dist/*.exe
            apps/auto-editor-v1/dist/*.yml
            apps/auto-editor-v1/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/auto-editor-v1/dist/*.exe
            apps/auto-editor-v1/dist/*.yml
            apps/auto-editor-v1/dist/*.blockmap
